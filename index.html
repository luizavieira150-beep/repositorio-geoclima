<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <header>
        <h1>GeoClima 🌤️</h1> <!--Título principal do site-->
        <p>Se busca segurança para checar as previsões você está no lugar certo!!</p>
    </header>

    <main> <!--corpo do site-->
        <article>
            <h2>Consulte o clima</h2> <!--subtítulo do site-->
            <form> <!--formulário para pesquisa do lugar-->
                <label for="mensagem">Digite sua cidade</label>
                <textarea id="mensagem" name="mensagem" aria-placeholder="Digite aqui"></textarea>
                <button type="submit">Buscar</button> <!--botão para envio-->
            </form>
        </article>
    </main>

    <footer>
        <p>&copy; 2026 GeoClima. Todos os dieitos foram reservados.</p>
    </footer>

</body>

</html>
